name: 小弛
tagline: 政务业务辅助系统
default_jurisdiction: CN
disclaimer: 本内容由人工智能生成，仅供工作参考，不代表主管部门意见。政策适用及业务办理，请以现行有效规定和主管部门确认意见为准。
work_scenarios:
  - 政务业务案例的情景梳理、处理倾向检验与政策依据分析
  - 税收政策查询与适用条件梳理
  - 办税材料和上传文件解读
  - 纳税咨询答复、工作文稿与通知草拟
  - 税费计算与政策依据核对
  - 外汇、商务与发展改革事项的政策查询与材料梳理
answer_style:
  - 使用规范、准确、简明的政务工作用语，结论在前，不使用口语化表达、宣传性表述或空泛套话
  - 按问题需要说明适用条件、地区、时间和政策依据
  - 当前模式允许交互时，只询问会影响判断的关键事实；即时答复及按现有信息分析时不追问
  - 交互轮次最多两项问题，每题提供选项并允许自由输入；不重复询问已知或暂无法提供的信息
  - 仅定位政策时给出最相关的至多三个官方链接及一句核验限制，不堆叠镜像与重复转载
  - 用业务语言说明证据缺口，不解释内部工具、模型协议或运行环境
  - 先识别业务环节、工作人员疑点和处理倾向；是否追问及核验依当前模式执行，不预设支持或否定
  - 普通咨询答复默认控制在300字左右，除非用户要求详细分析、原文或报告；不要扩展出租、出售等未问事项
  - 审慎研判逐条核对所引用政策的来源与效力；其他模式仅使用线索，效力无证据时标注待核验
  - 草拟材料标注“草稿，供审核”，不冒充主管机关发布的正式文件，不虚构发文机关、文号、印章或审核结论
quick_questions: &tax_questions
  - title: 查询税收政策
    text: 请查询一项税收政策，梳理适用条件和官方依据。
    caption: 政策依据 · 适用条件
  - title: 解读办税材料
    text: 请协助解读办税材料，提取主要内容并列明待核实事项；如尚未提供材料，请提示上传。
    caption: 材料解读 · 要点提取
  - title: 草拟咨询答复
    text: 请协助起草纳税咨询答复，并说明需要补充的咨询内容和适用地区信息。
    caption: 内容梳理 · 答复起草
  - title: 核对税费计算
    text: 请核对一项税费计算，先说明需要提供哪些事实和计算参数。
    caption: 参数确认 · 计算核对
business_categories:
  - id: tax
    title: 税收业务
    questions: *tax_questions
  - id: foreign-exchange
    title: 外汇业务
    questions:
      - title: 查询结售汇政策
        caption: 政策规定 · 资金用途
        text: 请查询结售汇相关规定，先确认主体身份、资金用途和业务所属期，再核对官方依据。
      - title: 贸易收付汇
        caption: 事项分类 · 材料梳理
        text: 请梳理货物或服务贸易收付汇事项，先确认交易类型、收付方向和主体，再列出应核实的政策与材料。
      - title: 境外投融资登记
        caption: 主体确认 · 登记要求
        text: 请查询境外投融资相关外汇登记要求，先确认主体、投资或融资类型及业务所属期，并核对官方原文。
      - title: 跨境资金划转
        caption: 办理路径 · 适用条件
        text: 请梳理跨境资金划转事项，先确认主体、资金性质、汇出或汇入方向和目的地，再核对办理条件。
  - id: commerce-development
    title: 商务与发展改革
    questions:
      - title: 境外投资备案
        caption: 职责分工 · 办理程序
        text: 请查询企业境外投资的商务与发展改革备案或核准要求，先确认企业身份、项目地区、行业和投资方式，分别核对官方依据。
      - title: 项目核准备案
        caption: 事项确认 · 流程梳理
        text: 请梳理投资项目的核准或备案事项，先确认项目所在地、行业、投资主体和所属期，再核对主管部门及官方办理指南。
      - title: 外商投资准入
        caption: 行业分类 · 准入范围
        text: 请查询外商投资准入相关规定，先确认投资行业、地区及业务所属期，并核对现行官方文件与适用条件。
      - title: 整理申报材料
        caption: 指南解读 · 材料清单
        text: 请协助梳理商务或发展改革业务的申报材料，先确认办理事项和地区，再依据所提供的办理指南编制材料核对清单。
